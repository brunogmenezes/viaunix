# ViaUnix - Autenticacao externa via API Jupiter
API_URL=https://api.jupiter.com.br/action/Usuario/logar
TIMEOUT=10

# Cria o usuario Linux automaticamente no primeiro login valido (sem sudo)
AUTO_CREATE_USER=true
USER_GROUPS=users,audio,video,plugdev,netdev

# Permite login offline usando hash seguro (scrypt) da ultima senha validada.
# Se a API recusar a senha online (401/403), o cache daquele usuario e apagado.
ALLOW_OFFLINE_CACHE=true

# Verifica o certificado TLS da API (mantenha true em producao)
VERIFY_TLS=true

# Usuarios locais (separados por virgula) que nunca consultam a API
LOCAL_ONLY_USERS=root
