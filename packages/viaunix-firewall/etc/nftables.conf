#!/usr/sbin/nft -f
# ViaUnix - Firewall padrao (politica: negar entrada, permitir saida)

flush ruleset

table inet viaunix {
    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state invalid drop
        ct state { established, related } accept

        # Anti-spoofing basico
        iif != lo ip saddr 127.0.0.0/8 drop
        iif != lo ip daddr 127.0.0.0/8 drop

        # Anti port-scan simples
        tcp flags & (fin|syn|rst|psh|ack|urg) == 0 drop
        tcp flags & (fin|syn) == fin|syn drop
        tcp flags & (syn|rst) == syn|rst drop

        # ICMP / ICMPv6 com limite
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
        ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
        ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 10/second accept

        # DHCP cliente IPv4 / IPv6
        udp sport 67 udp dport 68 accept
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

        # SSH de entrada: DESABILITADO por padrao. Para liberar:
        # tcp dport 22 ct state new limit rate 5/minute accept

        # Registro com limite do que for descartado
        limit rate 5/minute log prefix "[viaunix-fw drop] " level info
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
        ct state invalid drop
    }
}
