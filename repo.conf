# Configuração do repositório APT do ViaUnix (usada pelos scripts em scripts/)
# URL pública do repositório (IP direto funciona; HTTP é seguro porque o APT valida a assinatura GPG)
REPO_URL=http://172.16.152.2/viaunix/apt
# Servidor onde o repositório é publicado (acesso SSH)
REPO_SERVER=root@172.16.152.2
# Pasta servida pelo servidor web (dists/ e pool/)
REPO_WEB_DIR=/var/www/html/viaunix/apt
# Pasta de trabalho do reprepro no servidor (conf/, db/, incoming/) - NÃO exposta na web
REPO_BASE=/srv/viaunix-repo
# Codinome da distribuição no repositório
CODENAME=trixie
