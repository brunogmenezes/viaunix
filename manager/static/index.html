<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ViaUnix Manager</title>
<style>
  :root {
    --bg: #081529; --panel: #0e2240; --panel2: #132c52; --border: #1e3f73;
    --text: #eef4ff; --muted: #93aed6; --accent: #ff9f1a; --ok: #2ecc71; --err: #e74c3c; --blue: #2980b9;
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 18px; color: var(--accent); letter-spacing: .5px; }
  main { max-width: 1280px; margin: 24px auto; padding: 0 20px; }
  .hidden { display: none !important; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .login-box { max-width: 380px; margin: 90px auto; }
  label { display: block; font-size: 13px; color: var(--muted); margin-top: 12px; }
  input, select, textarea { width: 100%; padding: 9px 11px; margin-top: 5px; border-radius: 6px; border: 1px solid var(--border); background: #071222; color: var(--text); }
  button { cursor: pointer; border: 0; border-radius: 6px; padding: 8px 13px; font-weight: 600; font-size: 13px; background: var(--blue); color: #fff; }
  button:hover { filter: brightness(1.12); }
  button.accent { background: var(--accent); color: #081529; }
  button.danger { background: var(--err); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.sm { padding: 5px 9px; font-size: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; }
  .kpi .num { font-size: 28px; font-weight: 700; margin-top: 4px; }
  .kpi .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .toolbar input { max-width: 320px; margin-top: 0; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button.active { background: var(--accent); color: #081529; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge.on { background: rgba(46,204,113,.18); color: var(--ok); }
  .badge.off { background: rgba(231,76,60,.18); color: var(--err); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; max-width: 680px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 20px; }
  pre { background: #050d1a; border: 1px solid var(--border); border-radius: 6px; padding: 10px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; }
  .msg { margin-top: 10px; font-size: 13px; color: var(--err); }
  .secret-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .secret-row code { flex: 1; background: #050d1a; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>ViaUnix Manager</h1>
  <div id="userBar" class="hidden" style="display:flex;gap:12px;align-items:center;">
    <span id="userName" style="color:var(--muted);font-size:13px;"></span>
    <button class="ghost sm" onclick="doLogout()">Sair</button>
  </div>
</header>

<main>
  <!-- Login -->
  <section id="loginView" class="card login-box">
    <h2 style="margin-top:0">Acesso Administrativo</h2>
    <p style="font-size:13px;color:var(--muted);margin-top:0">Use seu usuario da TI (API Jupiter) ou a conta admin local.</p>
    <form onsubmit="doLogin(event)">
      <label>Usuario</label>
      <input id="u" autocomplete="username" required>
      <label>Senha</label>
      <input id="p" type="password" autocomplete="current-password" required>
      <button class="accent" style="width:100%;margin-top:16px" type="submit">Entrar</button>
      <div id="loginMsg" class="msg"></div>
    </form>
  </section>

  <!-- Dashboard -->
  <section id="appView" class="hidden">
    <div class="kpis">
      <div class="kpi"><div class="lbl">Estacoes</div><div class="num" id="kpiTotal">0</div></div>
      <div class="kpi"><div class="lbl">Online</div><div class="num" style="color:var(--ok)" id="kpiOnline">0</div></div>
      <div class="kpi"><div class="lbl">Offline</div><div class="num" style="color:var(--err)" id="kpiOffline">0</div></div>
    </div>

    <div class="tabs">
      <button id="tabMachines" class="active" onclick="showTab('machines')">Maquinas</button>
      <button id="tabAudit" class="ghost" onclick="showTab('audit')">Auditoria</button>
      <button id="btnMesh" class="accent hidden" onclick="openMeshCentral()">Tela Remota (MeshCentral)</button>
    </div>

    <div id="machinesPane" class="card">
      <div class="toolbar">
        <input id="search" placeholder="Filtrar por hostname, IP, usuario ou MAC..." oninput="renderMachines()">
        <button class="ghost" onclick="loadMachines()">Atualizar</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Status</th><th>Hostname</th><th>Usuario logado</th><th>IP</th>
              <th>CPU / RAM / Disco</th><th>Ultimo contato</th><th>Acoes</th>
            </tr>
          </thead>
          <tbody id="machinesBody"></tbody>
        </table>
      </div>
    </div>

    <div id="auditPane" class="card hidden">
      <div class="toolbar"><button class="ghost" onclick="loadAudit()">Atualizar auditoria</button></div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Data/Hora</th><th>Ator</th><th>Acao</th><th>Maquina</th><th>IP</th><th>Detalhes</th></tr></thead>
          <tbody id="auditBody"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<div id="modalBg" class="modal-bg hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
let machines = [];
let timer = null;
let meshUrl = '';

function openMeshCentral() {
  if (meshUrl) window.open(meshUrl, '_blank', 'noopener');
}

async function api(url, opts={}) {
  const res = await fetch(url, { credentials: 'same-origin', headers: {'Content-Type':'application/json'}, ...opts });
  if (res.status === 401 && !url.includes('/auth/login')) { showLogin(); throw new Error('401'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
  return data;
}

function showLogin() {
  clearInterval(timer);
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('userBar').classList.add('hidden');
}

function showApp(user, mcUrl) {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('userBar').classList.remove('hidden');
  document.getElementById('userName').textContent = 'Logado como: ' + user;
  if (mcUrl) {
    meshUrl = mcUrl;
    document.getElementById('btnMesh').classList.remove('hidden');
  }
  loadMachines();
  clearInterval(timer);
  timer = setInterval(loadMachines, 15000);
}

async function doLogin(e) {
  e.preventDefault();
  document.getElementById('loginMsg').textContent = '';
  try {
    const d = await api('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ usuario: document.getElementById('u').value, senha: document.getElementById('p').value })
    });
    document.getElementById('p').value = '';
    const me = await api('/api/auth/me');
    showApp(me.usuario, me.meshcentral_url);
  } catch (err) {
    document.getElementById('loginMsg').textContent = err.message;
  }
}

async function doLogout() {
  await api('/api/auth/logout', { method: 'POST' }).catch(()=>{});
  showLogin();
}

function showTab(t) {
  const isM = t === 'machines';
  document.getElementById('machinesPane').classList.toggle('hidden', !isM);
  document.getElementById('auditPane').classList.toggle('hidden', isM);
  document.getElementById('tabMachines').className = isM ? 'active' : 'ghost';
  document.getElementById('tabAudit').className = isM ? 'ghost' : 'active';
  if (!isM) loadAudit();
}

function fmtDate(iso) {
  if (!iso) return '-';
  try { return new Date(iso).toLocaleString('pt-BR'); } catch { return iso; }
}

function fmtPct(v) { return (v === null || v === undefined) ? '-' : Math.round(v) + '%'; }

async function loadMachines() {
  try {
    const d = await api('/api/machines');
    machines = d.machines || [];
    const on = machines.filter(m => m.online).length;
    document.getElementById('kpiTotal').textContent = machines.length;
    document.getElementById('kpiOnline').textContent = on;
    document.getElementById('kpiOffline').textContent = machines.length - on;
    renderMachines();
  } catch {}
}

function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderMachines() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  const rows = machines.filter(m =>
    [m.hostname, m.usuario, m.logged_user, m.ip_local, m.ip_origem, m.mac].join(' ').toLowerCase().includes(q)
  );
  document.getElementById('machinesBody').innerHTML = rows.map(m => `
    <tr>
      <td><span class="badge ${m.online ? 'on':'off'}">${m.online ? 'ONLINE':'OFFLINE'}</span></td>
      <td><strong>${esc(m.hostname)}</strong><br><span style="font-size:11px;color:var(--muted)">${esc(m.mac || m.usuario)}</span></td>
      <td>${esc(m.logged_user || '-')}</td>
      <td>${esc(m.ip_local || m.ip_origem || '-')}</td>
      <td>${fmtPct(m.cpu_percent)} / ${fmtPct(m.mem_percent)} / ${fmtPct(m.disk_percent)}</td>
      <td style="font-size:12px;color:var(--muted)">${fmtDate(m.last_seen)}</td>
      <td>
        <div class="actions">
          <button class="sm accent" onclick="reveal(${m.id})">Senhas</button>
          ${meshUrl ? '<button class="sm" onclick="openMeshCentral()">Tela</button>' : ''}
          <button class="sm" onclick="sendCmd(${m.id},'apt_upgrade','${esc(m.hostname)}')">Atualizar</button>
          <button class="sm" onclick="sendCmd(${m.id},'lock_screen','${esc(m.hostname)}')">Bloquear</button>
          <button class="sm danger" onclick="sendCmd(${m.id},'reboot','${esc(m.hostname)}')">Reiniciar</button>
          <button class="sm ghost" onclick="openConsole(${m.id},'${esc(m.hostname)}')">Console</button>
        </div>
      </td>
    </tr>
  `).join('') || '<tr><td colspan="7" style="color:var(--muted)">Nenhuma maquina encontrada.</td></tr>';
}

function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalBg').classList.remove('hidden');
}
function closeModal() { document.getElementById('modalBg').classList.add('hidden'); }
function copyText(txt) { navigator.clipboard.writeText(txt); }

async function reveal(id) {
  try {
    const d = await api('/api/machines/' + id + '/reveal', { method: 'POST' });
    openModal(`
      <h3 style="margin-top:0">Cofre de Credenciais — ${esc(d.hostname)}</h3>
      <p style="font-size:12px;color:var(--muted)">Acesso registrado na auditoria. Senhas descriptografadas sob demanda (AES-256-GCM).</p>
      <label>Usuario admin local (sudo)</label>
      <div class="secret-row"><code>${esc(d.usuario)}</code><button class="sm" onclick="copyText('${esc(d.usuario)}')">Copiar</button></div>
      <label>Senha admin local</label>
      <div class="secret-row"><code>${esc(d.senha)}</code><button class="sm" onclick="copyText('${esc(d.senha)}')">Copiar</button></div>
      <label>Senha root</label>
      <div class="secret-row"><code>${esc(d.root_senha || '(nao definida)')}</code><button class="sm" onclick="copyText('${esc(d.root_senha)}')">Copiar</button></div>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:space-between">
        <button class="danger sm" onclick="sendCmd(${id},'rotate_password','${esc(d.hostname)}')">Rotacionar senhas agora</button>
        <button class="ghost" onclick="closeModal()">Fechar</button>
      </div>
    `);
  } catch (err) { alert(err.message); }
}

async function sendCmd(id, action, hostname, payload='') {
  const labels = {
    reboot: 'Reiniciar ' + hostname + ' agora?',
    shutdown: 'Desligar ' + hostname + ' agora?',
    apt_upgrade: 'Executar apt update && full-upgrade em ' + hostname + '?',
    lock_screen: 'Bloquear tela de ' + hostname + '?',
    rotate_password: 'Gerar e aplicar NOVAS senhas aleatorias em ' + hostname + '?',
    shell: 'Executar comando em ' + hostname + '?'
  };
  if (action !== 'shell' && !confirm(labels[action] || 'Confirmar acao?')) return;
  try {
    await api('/api/machines/' + id + '/command', { method: 'POST', body: JSON.stringify({ action, payload }) });
    alert('Comando enfileirado para ' + hostname + '. Sera executado no proximo heartbeat (ate 30s).');
  } catch (err) { alert(err.message); }
}

async function openConsole(id, hostname) {
  const d = await api('/api/machines/' + id + '/commands');
  const hist = (d.commands || []).map(c => `
    <div style="margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:8px">
      <div style="font-size:12px;color:var(--muted)">
        #${c.id} <strong>${esc(c.action)}</strong> ${c.payload ? '('+esc(c.payload)+')':''} — <strong>${esc(c.status)}</strong> por ${esc(c.requested_by)} em ${fmtDate(c.created_at)}
      </div>
      ${c.output ? '<pre>'+esc(c.output)+'</pre>' : ''}
    </div>
  `).join('') || '<p style="color:var(--muted);font-size:13px">Nenhum comando executado ainda.</p>';

  openModal(`
    <h3 style="margin-top:0">Console & Historico — ${esc(hostname)}</h3>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input id="shellInput" placeholder="Ex: uptime && df -h" style="margin-top:0">
      <button class="accent" onclick="runShell(${id},'${esc(hostname)}')">Executar</button>
      <button class="danger sm" onclick="sendCmd(${id},'shutdown','${esc(hostname)}')">Desligar</button>
    </div>
    <div style="max-height:360px;overflow-y:auto">${hist}</div>
    <div style="margin-top:12px;text-align:right">
      <button class="ghost sm" onclick="openConsole(${id},'${esc(hostname)}')">Recarregar</button>
      <button class="ghost sm" onclick="closeModal()">Fechar</button>
    </div>
  `);
}

async function runShell(id, hostname) {
  const val = document.getElementById('shellInput').value.trim();
  if (!val) return;
  await sendCmd(id, 'shell', hostname, val);
  openConsole(id, hostname);
}

async function loadAudit() {
  try {
    const d = await api('/api/audit');
    document.getElementById('auditBody').innerHTML = (d.audit || []).map(a => `
      <tr>
        <td style="font-size:12px;color:var(--muted)">${fmtDate(a.created_at)}</td>
        <td>${esc(a.actor)}</td>
        <td><strong>${esc(a.action)}</strong></td>
        <td>${esc(a.target_hostname || '-')}</td>
        <td>${esc(a.ip || '-')}</td>
        <td style="font-size:12px;color:var(--muted)">${esc(a.details || '-')}</td>
      </tr>
    `).join('');
  } catch {}
}

api('/api/auth/me').then(d => showApp(d.usuario, d.meshcentral_url)).catch(() => showLogin());
</script>
</body>
</html>
