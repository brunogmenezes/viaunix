---
# ViaUnix - pacotes tratados pelo Calamares durante a instalação.
# Substitui a lista do calamares-settings-debian, que cita pacotes
# (live-task-*) inexistentes na nossa imagem e derrubava a instalação.
backend: apt
update_db: false
update_system: false

operations:
  - remove:
      - live-boot
      - live-config
      - live-config-systemd
      - live-tools
      - calamares-settings-debian
      - calamares
